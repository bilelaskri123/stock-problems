services:
  backend-api:
    build: ./server
    container_name: stock_backend
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production

  frontend-web:
    build: ./main
    container_name: stock_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend-api

# 1. Place this map block OUTSIDE the server block (at the http level)
# This dynamically handles Connection headers for both HTTP and WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# frontend/nginx.conf
server {
    listen 80;
    server_name localhost;
    

    # Serve the Angular Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to redirect /api requests to the Node.js backend
    location /api/ {
        # 'backend-api' matches the service name in your docker-compose.yml
        proxy_pass http://backend-api:3001;

        # 3. Explicitly use HTTP/1.1 (Required for WebSockets)
        proxy_http_version 1.1;

        # Apply your headers dynamically
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # 5. Node.js Specific Optimizations
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 6. Prevent premature timeouts on long-lived connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}